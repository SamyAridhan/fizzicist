<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#0A6640" />
    <title>Fizzicist</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      body { background: #F7F7F5; -webkit-font-smoothing: antialiased; font-smoothing: antialiased; }
      button { -webkit-appearance: none; appearance: none; }
      input { -webkit-appearance: none; appearance: none; }
      input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.5; }

      @keyframes fzFadeUp {
        from { opacity: 0; transform: translateX(-50%) translateY(10px); }
        to   { opacity: 1; transform: translateX(-50%) translateY(0); }
      }
      @-webkit-keyframes fzFadeUp {
        from { opacity: 0; -webkit-transform: translateX(-50%) translateY(10px); }
        to   { opacity: 1; -webkit-transform: translateX(-50%) translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
